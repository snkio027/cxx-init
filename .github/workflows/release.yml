name: Verify Linux and publish release

permissions:
  contents: read

concurrency:
  # Superseded PR feedback may be cancelled; main/release evidence must survive.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  fast:
    name: Fast policy feedback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Offline feedback
        run: |
          python3 -m unittest discover -s tests -p test_ci_policy.py -v
          PYTHONPATH=tests python3 -m unittest test_workflow.WorkflowTests -v

  plan:
    name: Plan full candidate coverage
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout test-merge history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record candidate identity and coverage
        id: plan
        run: python3 scripts/ci/plan.py

  build:
    name: Build and verify distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.7"
          enable-cache: false

      - name: Build distributions
        run: uv build --no-sources

      - name: Select the verified CMake baseline
        run: |
          uv tool install "cmake==4.4.4"
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Prepare isolated Linux integration tools
        run: |
          curl --fail --location --retry 3 \
            https://github.com/clangd/clangd/releases/download/23.1.0/clangd-linux-23.1.0.zip \
            --output "$RUNNER_TEMP/clangd.zip"
          echo "e53b1a96196095faedb7642cf64964f7fb9ad4a0c1f00dd2c172a3d9dcbafdfd  $RUNNER_TEMP/clangd.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/clangd.zip" -d "$RUNNER_TEMP"
          echo "CLANGD=$RUNNER_TEMP/clangd_23.1.0/bin/clangd" >> "$GITHUB_ENV"
          git init "$RUNNER_TEMP/cxx-vcpkg"
          git -C "$RUNNER_TEMP/cxx-vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$RUNNER_TEMP/cxx-vcpkg" fetch --depth 1 origin 434307da09bc05b2c86996dccc8b2351fc0d5d37
          git -C "$RUNNER_TEMP/cxx-vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/cxx-vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/cxx-vcpkg" >> "$GITHUB_ENV"

      - name: Verify the wheel and generated project contracts
        env:
          # Ubuntu 24.04's default GCC 13 has no <print>; GCC 14 is preinstalled.
          CXX: g++-14
          CC: gcc-14
          CXX_TEST_CLANGD: "1"
          CXX_TEST_VCPKG: "1"
          # Require a real dependency build, not a pre-existing binary-cache hit.
          VCPKG_BINARY_SOURCES: clear
          # Test the distributions uploaded below; do not build a second wheel.
          CXX_TEST_DIST: ${{ github.workspace }}/dist
        run: |
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            CXX_RELEASE_TAG="$GITHUB_REF_NAME"
          else
            CXX_RELEASE_TAG="v$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          fi
          export CXX_RELEASE_TAG
          cmake --version
          "$CXX" --version
          "$CLANGD" --version
          "$VCPKG_ROOT/vcpkg" version
          python3 -m unittest discover -s tests -v

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    name: Publish to PyPI
    needs: [build, delivery]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cxx-init
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  delivery:
    # Draft feedback and main/manual runs cannot emit the admission context.
    name: ${{ github.event_name == 'pull_request' && (github.event.pull_request.draft && 'Draft Delivery Feedback' || 'Delivery / Quality / pr-full-standard-v1') || (github.event_name == 'push' && 'Main Delivery Quality' || 'Release and Maintenance Quality') }}
    if: ${{ always() }}
    needs: [fast, plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout candidate history
        if: ${{ !cancelled() }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete candidate evidence
        if: ${{ !cancelled() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/delivery_gate.py
      - name: Reject cancellation
        if: ${{ cancelled() }}
        run: exit 1
